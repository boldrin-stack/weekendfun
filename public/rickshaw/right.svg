  <rect x="594" y="312" width="126" height="48" rx="6" fill="#FBFAF6" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="594" y="366" width="126" height="54" rx="6" fill="#FBFAF6" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5"/>
